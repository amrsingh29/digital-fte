[project]
name = "digital-fte"
version = "0.2.0"
description = "Local dashboard that turns coding-agent history into Digital FTE numbers"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
claude = ["anthropic==1.12.1"]

[project.scripts]
fte = "digital_fte.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digital_fte = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
